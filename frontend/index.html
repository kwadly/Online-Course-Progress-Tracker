<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Progress Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="auth" class="auth"></div>

  <div id="shell" class="shell hidden">
    <aside class="side">
      <div class="brand">Course Tracker</div>
      <nav id="menu"></nav>
      <div class="who">
        <div id="who"></div>
        <button id="logoutBtn" class="ghost">Log out</button>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button id="backBtn" class="back" title="Back">&#8592;</button>
        <h2 id="title"></h2>
      </div>
      <p id="msg"></p>
      <main id="app"></main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
